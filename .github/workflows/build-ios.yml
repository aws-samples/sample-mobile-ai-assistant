name: Build for iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.10'
          bundler-cache: true
          working-directory: react-native
      - name: Test Ruby dependency security and compatibility
        working-directory: react-native
        run: bundle exec ruby scripts/ruby-security.test.rb
      - name: Install JavaScript dependencies
        working-directory: react-native
        run: npm ci
      - name: Install CocoaPods dependencies
        working-directory: react-native/ios
        run: bundle exec pod install
      - name: Build iOS simulator archive
        working-directory: react-native
        run: npm run build:ios
