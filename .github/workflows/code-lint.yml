name: Code Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run package install
        run: cd react-native && npm ci
      - name: Run dependency security regression tests
        run: cd react-native && npm run test:security
      - name: Audit dependencies
        # Any advisory fails, except unpatched ones reviewed in audit-allowlist.json.
        run: cd react-native && npm run audit:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend SSRF protection
        run: |
          python -m pip install -r server/src/requirements.txt
          PYTHONPATH=server/src python -m unittest discover -s server/tests -v
      - name: Run code format
        run: cd react-native && npm run format
      - name: Run code lint
        run: cd react-native && npm run lint
